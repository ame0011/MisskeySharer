# mise (https://mise.jdx.dev) の設定。
# `mise install` で [tools] のJDKをインストールし、`mise run <タスク名>` でタスクを実行できます。
[tools]
# Eclipse Temurin 25 (CIと同一)
java = "temurin-25"

[tasks.build]
description = "デバッグビルド (app/build/outputs/apk/debug/app-debug.apk)"
run = "./gradlew assembleDebug"
run_windows = "gradlew.bat assembleDebug"

[tasks.release]
description = "リリースビルド (keystore.propertiesが無ければ未署名)"
run = "./gradlew assembleRelease"
run_windows = "gradlew.bat assembleRelease"

[tasks.test]
description = "ユニットテスト (Robolectric)"
run = "./gradlew test"
run_windows = "gradlew.bat test"

[tasks.check]
description = "CIと同じチェック"
run = "./gradlew build"
run_windows = "gradlew.bat build"

[tasks.clean]
description = "ビルド成果物の削除"
run = "./gradlew clean"
run_windows = "gradlew.bat clean"
