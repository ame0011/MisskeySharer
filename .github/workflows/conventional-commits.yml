# コミットが[Conventional Commits](https://www.conventionalcommits.org/ja/v1.0.0/)に沿っていることをチェックする
name: Conventional Commits

on:
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - uses: webiny/action-conventional-commits@v1.0.3
